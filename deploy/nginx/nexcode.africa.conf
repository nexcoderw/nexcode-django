server {
    listen 80;
    listen [::]:80;
    server_name nexcode.africa www.nexcode.africa;

    client_max_body_size 25m;

    access_log /var/log/nginx/nexcode.africa.access.log;
    error_log /var/log/nginx/nexcode.africa.error.log;

    location /static/ {
        alias /var/www/nexcode/api/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/nexcode/api/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
