version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexcode_web
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "127.0.0.1:8000:8000"   # bind to localhost; your host nginx should proxy to this
    volumes:
      - ./:/app                      # mount code for quick deploy (optional)
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Using a hosted Postgres (e.g., Neon) via DATABASE_URL from .env

volumes:
  static_volume:
  media_volume:
  # postgres_data:
