name: CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute image name/tags
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "IMAGE=ghcr.io/${REPO,,}" >> $GITHUB_OUTPUT
          echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ steps.meta.outputs.IMAGE }}:latest

      - name: Smoke test - manage.py check
        run: |
          echo "DJANGO_DB=sqlite" > ci.env
          docker run --rm --env-file ./ci.env \
            ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }} \
            python manage.py check


  deploy:
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && needs.build_and_test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

            - name: Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" bash -s -- "$IMAGE" "$GHCR_USERNAME" "$GHCR_TOKEN" "$DEPLOY_PATH" <<'EOSSH'
          set -euo pipefail

          IMAGE="$1"
          GHCR_USER="$2"
          GHCR_TOKEN="$3"
          DEPLOY_PATH="$4"

          echo "=== NexCode Deployment Starting ==="

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          echo "Logging in to GHCR..."
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Writing docker-compose.yml"
          cat > docker-compose.yml <<EOF
          services:
            web:
              image: $IMAGE
              container_name: nexcode
              network_mode: host
              restart: always
              env_file:
                - $DEPLOY_PATH/.env
              volumes:
                - $DEPLOY_PATH/staticfiles:/app/staticfiles
                - $DEPLOY_PATH/media:/app/media
                - $DEPLOY_PATH/.env:/app/.env:ro
            EOF

          echo "Starting services..."
          docker compose down --remove-orphans || true
          docker compose up -d --force-recreate

          echo "Running migrations..."
          docker compose exec -T web python manage.py migrate --noinput

          echo "Collecting static files..."
          docker compose exec -T web python manage.py collectstatic --noinput

          echo "=== Deployment Finished Successfully ==="
          EOSSH
