name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: echo "No tests defined - skipping"

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client netcat-openbsd

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} bash -e << 'EOF'
            set -euo pipefail
            cd "${DEPLOY_PATH}"

            echo "=== 1) Creating backup ==="
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            mkdir -p backups
            tar czf backups/code_${TIMESTAMP}.tar.gz .
            if [ -f db.sqlite3 ]; then
              cp db.sqlite3 backups/db_${TIMESTAMP}.sqlite3
            fi

            echo "=== 2) Pulling latest code from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3) Using systemd deployment (gunicorn + venv) ==="
            VENV="./venv"
            if [ ! -d "$VENV" ]; then
              VENV="/var/www/nexcode/venv"
            fi
            echo "Virtualenv: $VENV"

            echo "=== 4) Installing updated dependencies ==="
            source $VENV/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "=== 5) Running migrations ==="
            python manage.py migrate --noinput

            echo "=== 6) Collecting static files ==="
            python manage.py collectstatic --noinput

            deactivate

            echo "=== 7) Restarting systemd service (nexcode.service) ==="
            systemctl restart nexcode.service

            sleep 2
            systemctl is-active --quiet nexcode.service || {
              echo "Service failed to restart!"
              systemctl status nexcode.service --no-pager
              exit 1
            }

            echo "=== Deployment completed successfully ==="
          EOF
