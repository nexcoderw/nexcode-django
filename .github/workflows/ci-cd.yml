name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations in CI sqlite database
        env:
          DJANGO_ENV: development
          DEBUG: "True"
          SECRET_KEY: ci-secret-key
          DJANGO_DB: sqlite
          USE_CLOUDINARY_MEDIA: "False"
        run: python manage.py migrate --noinput

      - name: Django system checks
        env:
          DJANGO_ENV: development
          DEBUG: "True"
          SECRET_KEY: ci-secret-key
          DJANGO_DB: sqlite
          USE_CLOUDINARY_MEDIA: "False"
        run: python manage.py check

      - name: Django deploy checks
        env:
          DJANGO_ENV: production
          DEBUG: "False"
          SECRET_KEY: ci-secret-key
          DJANGO_DB: sqlite
          ALLOWED_HOSTS: nexcode.africa,www.nexcode.africa
          CSRF_TRUSTED_ORIGINS: https://nexcode.africa,https://www.nexcode.africa
          USE_CLOUDINARY_MEDIA: "False"
        run: python manage.py check --deploy

      - name: Collect static files
        env:
          DJANGO_ENV: production
          DEBUG: "False"
          SECRET_KEY: ci-secret-key
          DJANGO_DB: sqlite
          ALLOWED_HOSTS: nexcode.africa,www.nexcode.africa
          CSRF_TRUSTED_ORIGINS: https://nexcode.africa,https://www.nexcode.africa
          USE_CLOUDINARY_MEDIA: "False"
        run: python manage.py collectstatic --noinput

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy exact commit to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/var/www/nexcode/bin/nexcode-api-deploy.sh ${DEPLOY_REF}"
