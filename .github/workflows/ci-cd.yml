name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # Add your test command(s) here
          # Example: python manage.py test
          echo "No tests defined - skip" 

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure server known host (adds host key)
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server (safe pull + backup + compose)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -euo pipefail
            echo "=== On server: check deploy directory ==="
            cd ${DEPLOY_PATH}
            echo "=== Create backup of current code and sqlite (if exists) ==="
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            mkdir -p backups
            tar czf backups/code_${TIMESTAMP}.tar.gz .
            if [ -f db.sqlite3 ]; then
              cp db.sqlite3 backups/db.sqlite3_${TIMESTAMP}
            fi
            echo "=== Git fetch & reset to origin/main ==="
            # assuming repo here, ensure correct branch
            git fetch origin main
            git reset --hard origin/main
            echo "=== Pull down new or rebuild images and run docker-compose ==="
            # Choose strategy: if you use images pushed to registry, use docker-compose pull
            # Here we rebuild on the host to avoid Docker Hub push complexity
            docker-compose down --remove-orphans || true
            docker-compose build --pull
            docker-compose up -d --remove-orphans
            echo "=== Deployment finished ==="
            EOF
