name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # Add your test command(s) here
          # Example: python manage.py test --keepdb
          echo "No tests defined - skipping"

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client netcat

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure server known host (adds host key)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to server (safe pull + backup + conditional restart)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_REF: ${{ github.sha }}
        run: |
          # IMPORTANT: the remote commands are executed on your server via SSH.
          ssh -o StrictHostKeyChecking=yes ${SERVER_USER}@${SERVER_HOST} bash -e <<'EOF'
            set -euo pipefail
            echo "=== DEPLOY: starting at $(date -u) ==="
            cd "${DEPLOY_PATH}"

            echo "=== 1) Create timestamped backup of code and DB (if exists) ==="
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            mkdir -p backups
            tar czf backups/code_${TIMESTAMP}.tar.gz .
            if [ -f db.sqlite3 ]; then
              cp db.sqlite3 backups/db.sqlite3_${TIMESTAMP}
            fi

            echo "=== 2) Update git to origin/main ==="
            # Ensure we have origin and main
            git fetch --prune origin main
            git reset --hard origin/main

            echo "=== 3) Detect deployment type ==="
            USE_DOCKER=false
            USE_SYSTEMD=false
            if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
              USE_DOCKER=true
            fi
            # Check for a systemd unit referencing this directory (nexcode.service is used on your server)
            if systemctl list-units --type=service --all | grep -q 'nexcode.service'; then
              USE_SYSTEMD=true
            fi

            echo "USE_DOCKER=${USE_DOCKER} USE_SYSTEMD=${USE_SYSTEMD}"

            if [ "$USE_DOCKER" = true ]; then
              echo "=== Detected docker-compose deployment. Building & restarting containers ==="
              # Build and start
              docker-compose down --remove-orphans || true
              docker-compose build --pull
              docker-compose up -d --remove-orphans
              echo "=== Docker compose restarted ==="
            elif [ "$USE_SYSTEMD" = true ]; then
              echo "=== Detected systemd-managed deployment (nexcode.service). Preparing virtualenv actions ==="

              # Locate virtualenv folder heuristics
              VENV_PATH="./venv"
              if [ ! -d "${VENV_PATH}" ] && [ -d "/var/www/nexcode/venv" ]; then
                VENV_PATH="/var/www/nexcode/venv"
              fi

              if [ -d "${VENV_PATH}" ]; then
                echo "Using virtualenv at ${VENV_PATH}"
                # Make sure we have python & pip available; this will run as the user (root recommended) but keep commands explicit
                # Install new requirements into venv
                . "${VENV_PATH}/bin/activate"
                pip install --upgrade pip
                if [ -f requirements.txt ]; then
                  pip install -r requirements.txt
                fi

                # Run migrations and collectstatic safely
                python manage.py migrate --noinput || { echo "migrate failed"; exit 1; }
                python manage.py collectstatic --noinput || { echo "collectstatic failed"; exit 1; }
                deactivate
              else
                echo "Virtualenv not found at ${VENV_PATH}, skipping pip/migrate/collectstatic steps"
              fi

              echo "=== Restarting systemd unit: nexcode.service ==="
              # Restart the service and check status
              systemctl restart nexcode.service
              sleep 2
              systemctl is-active --quiet nexcode.service && echo "nexcode.service is active" || { echo "nexcode.service failed to start"; systemctl status nexcode.service --no-pager; exit 1; }
              echo "=== systemd restart complete ==="
            else
              echo "=== No docker-compose.yml and no known systemd unit found. As fallback: touch reload file and exit with error ==="
              exit 1
            fi

            echo "=== DEPLOY: finished at $(date -u) ==="
          EOF
