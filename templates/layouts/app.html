{% load static %}

<!DOCTYPE html>
<html lang="zxx">
<head>

    <!-- Metas -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="author" content="KAJUGA Daniels">

    <!-- Title  -->
    <title>Nexcode</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'imgs/favicon.ico' %}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Plugins -->
    <link rel="stylesheet" href="{% static 'css/plugins.css' %}">

    <!-- Core Style Css -->
    <link rel="stylesheet" href="{% static 'css/common_style.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <script>
        window.ga = window.ga || function() {
            ( ga.q = ga.q || []).push(arguments)
        };
        ga.l = +new Date;
        ga('create', 'UA-105392568-1', 'auto');
        ga('send', 'pageview');
    </script>

</head>

<body>

    {% include 'inc/loader.html' %}

    <div class="cursor"></div>
    <canvas class="banner_canvas" id="canvas_banner"></canvas>

    <div class="progress-wrap cursor-pointer">
        <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
            <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
        </svg>
    </div>

    {% include 'inc/nav.html' %}

    {% include 'inc/mobile-menu.html' %}

    <div id="smooth-wrapper">
        <div id="smooth-content">
            <main>
                {% block content %}{% endblock %}

                {% include 'inc/footer.html' %}
            </main>
        </div>
    </div>

    <!-- jQuery -->
    <script src="{% static 'js/lib/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/lib/jquery-migrate-3.4.0.min.js' %}"></script>

    <!-- plugins -->
    <script src="{% static 'js/lib/plugins.js' %}"></script>

    <!-- GSAP -->
    <script src="{% static 'js/gsap_lib/gsap.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/ScrollSmoother.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/ScrollTrigger.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/SplitText.min.js' %}"></script>
    <script src="{% static 'js/lib/smoke.js' %}"></script>

    <!-- common scripts -->
    <script src="{% static 'js/common_scripts.js' %}"></script>

    <!-- custom scripts -->
    <script src="{% static 'js/scripts.js' %}"></script>

    <script>

        gsap.registerPlugin(ScrollTrigger);

        // --- ORANGE PANEL ---

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".imgWrapper",
                scrub: true,
                pin: true,
                start: "40% 50%",
                end: "+=100%",
            }
        })

            .to(".imgWrapper .main-img", {
                clipPath: 'inset(0% 0%)',
                scale: 1,
                ease: 'Linear.easeNone'
            })


    </script>

</body>

</html>
