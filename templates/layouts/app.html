{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Metas -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{{ seo.title }}{% endblock %}</title>
        <meta name="description"
              content="{% block meta_description %}{{ seo.description }}{% endblock %}">
        <meta name="robots" content="{{ seo.robots }}">
        <link rel="canonical" href="{{ seo.canonical }}">
        <meta property="og:site_name" content="NEXCODE Africa">
        <meta property="og:locale" content="en_RW">
        <meta property="og:type" content="{{ seo.type }}">
        <meta property="og:title" content="{{ seo.title }}">
        <meta property="og:description" content="{{ seo.description }}">
        <meta property="og:url" content="{{ seo.canonical }}">
        <meta property="og:image" content="{{ seo.image }}">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ seo.title }}">
        <meta name="twitter:description" content="{{ seo.description }}">
        <meta name="twitter:image" content="{{ seo.image }}">
        <link rel="icon" href="{% static 'img/logo-w.png' %}" type="image/png">
        <script type="application/ld+json">{{ seo.structured_data|safe }}</script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Plugins -->
    <link rel="stylesheet" href="{% static 'css/plugins.css' %}">
    <link rel="stylesheet" href="{% static 'css/common_style.css' %}">
    <link rel="stylesheet" href="{% static 'css/inner_pages.css' %}">
    
    {% block styles %}{% endblock %}

    <script>
        window.ga = window.ga || function() {
            ( ga.q = ga.q || []).push(arguments)
        };
        ga.l = +new Date;
        ga('create', 'UA-105392568-1', 'auto');
        ga('send', 'pageview');
    </script>

</head>

<body>

    {% include 'inc/loader.html' %}
    {% include 'inc/nav.html' %}
    {% include 'inc/mobile-menu.html' %}

    <div id="smooth-wrapper">
        <div id="smooth-content">
            <main>
                {% block content %}{% endblock %}
                {% include 'inc/footer.html' %}
            </main>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index: 1050">
        <div id="toast-container"></div>
    </div>

    <!-- jQuery -->
    <script src="{% static 'js/lib/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/lib/jquery-migrate-3.4.0.min.js' %}"></script>

    <!-- Plugins -->
    <script src="{% static 'js/lib/plugins.js' %}"></script>

    <!-- GSAP -->
    <script src="{% static 'js/gsap_lib/gsap.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/ScrollSmoother.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/ScrollTrigger.min.js' %}"></script>
    <script src="{% static 'js/gsap_lib/SplitText.min.js' %}"></script>
    <script src="{% static 'js/lib/smoke.js' %}"></script>

    <!-- Common Scripts -->
    <script src="{% static 'js/common_scripts.js' %}"></script>
    <script src="{% static 'js/scripts.js' %}"></script>

    <!-- Bootstrap JS for Toast Notifications -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Toast Notification Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Example function to show a toast notification
            function showToast(message, type) {
                const toastId = 'toast' + Date.now();
                const toastHTML = `
                    <div id="${toastId}" class="toast align-items-center text-bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="9000">
                        <div class="d-flex">
                            <div class="toast-body">
                                <span class="toast-message"></span>
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                `;
                document.getElementById('toast-container').insertAdjacentHTML('beforeend', toastHTML);
                document.getElementById(toastId).querySelector('.toast-message').textContent = message;
                const toastElement = new bootstrap.Toast(document.getElementById(toastId));
                toastElement.show();
            }

            // Trigger notifications based on Django messages
            {% if messages %}
                {% for message in messages %}
                    showToast("{{ message|escapejs }}", "{% if message.level == 40 %}danger{% elif message.level == 30 %}warning{% elif message.level == 25 %}success{% else %}info{% endif %}");
                {% endfor %}
            {% endif %}
        });
    </script>

    {% block js %}{% endblock %}

</body>
</html>
