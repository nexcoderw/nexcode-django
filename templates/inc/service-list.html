<div class="row">
    {% for name, service in services.items %}
        <div class="col-lg-6 mb-50">
            <h2 class="fz-30 mb-20">
                <a href="{% url 'base:contact' %}?service={{ service.title|urlencode }}">{{ service.title }}</a>
            </h2>
            <p>{{ service.intro }}</p>
        </div>
    {% endfor %}
</div>
