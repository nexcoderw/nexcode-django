{% if form.errors %}
    <div class="form-errors mb-30" role="alert">
        <p>Please correct the fields below. Your entries have been kept.</p>
        {{ form.non_field_errors }}
    </div>
{% endif %}
{% for field in form %}
    <div class="form-group mb-30">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} (optional){% endif %}</label>{{ field }}{% if field.help_text %}
        <p class="fz-14" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
{% endif %}{{ field.errors }}</div>
{% endfor %}
