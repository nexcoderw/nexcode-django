{% extends 'admin/layouts/app.html' %}
{% load static %}
{% block content %}

<div class="pt-8 pb-12 px-7 relative z-10
    before:absolute before:inset-0 before:opacity-[.07] before:bg-foreground before:rounded-4xl
    after:absolute after:inset-0 after:bg-[color-mix(in_oklch,_var(--color-background),_var(--color-foreground)_2%)]
    after:rounded-4xl after:border after:border-foreground/[.15] dark:after:opacity-[.59]">

    <div class="relative z-20 max-w-3xl mx-auto">
        <h2 class="mt-10 mb-6 text-lg font-medium">Add New Testimony</h2>

        <form method="post" class="space-y-6" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="box relative p-6 before:absolute before:inset-0 before:mx-3 before:-mb-3 before:border before:border-foreground/10
                before:bg-background/30 before:shadow-[0px_3px_5px_#0000000b] before:z-[-1] before:rounded-xl
                after:absolute after:inset-0 after:border after:border-foreground/10 after:bg-background
                after:shadow-[0px_3px_5px_#0000000b] after:rounded-xl after:z-[-1] after:backdrop-blur-md">

                <div class="flex flex-col gap-5">
                    <div>
                        <label for="{{ form.client.id_for_label }}" class="block mb-1 font-semibold">
                            Client
                        </label>
                        {{ form.client }}
                        <p class="text-sm text-red-600 mt-1">{{ form.client.errors }}</p>
                    </div>

                    <div>
                        <label for="{{ form.message.id_for_label }}" class="block mb-1 font-semibold">
                            Message
                        </label>
                        {{ form.message }}
                        <p class="text-sm text-red-600 mt-1">{{ form.message.errors }}</p>
                    </div>
                </div>

            </div>

            <div class="flex flex-col md:flex-row gap-4 justify-end mt-6">
                <a href="{% url 'controller:testimonies' %}"
                   class="inline-flex items-center justify-center gap-2 rounded-lg border border-(--color)/60 bg-(--color)/10
                          px-6 py-3 text-(--color) font-medium hover:bg-(--color)/20 focus:outline-none focus:ring-2
                          focus:ring-(--color) focus:ring-offset-2">
                    Cancel
                </a>

                <button type="submit"
                        class="inline-flex items-center justify-center gap-2 rounded-lg border border-(--color)/60
                               bg-(--color)/20 px-6 py-3 text-(--color) font-medium hover:bg-(--color)/30
                               focus:outline-none focus:ring-2 focus:ring-(--color) focus:ring-offset-2">
                    Submit
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
